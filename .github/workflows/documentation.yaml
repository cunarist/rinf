# Build the documentation with the demo app and publish it on GitHub Pages.
name: Documentation

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Deployment needs an OIDC token, which is only issued
# when the workflow asks for these permissions.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Runs are queued instead of cancelled,
  # so that a deployment is never left half-finished.
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build-site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      # A project page is served from a subpath such as `/rinf`,
      # so the demo has to be told where it will live.
      - name: Resolve the demo base path
        id: demo
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: echo "href=${BASE_PATH%/}/_static/web_app/" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the documentation image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./documentation/Containerfile
          tags: rinf-docs:latest
          load: true
          build-args: BASE_HREF=${{ steps.demo.outputs.href }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract the built site from the image
        run: |
          container=$(docker create rinf-docs:latest)
          docker cp "${container}:/app/dist/dirhtml" ./site
          docker rm "${container}"

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./site

  deploy:
    name: deploy-site
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
